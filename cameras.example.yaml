# tapo-monitor example configuration.
#
# Copy to `cameras.yaml` (git-ignored) and fill in your own values. NOTHING here is
# real — no coordinates, hosts or secrets ship in the repository. Secrets are read
# from environment variables referenced by name (so the file itself stays safe to share).

# Shared location for astral (sunset/sunrise) scheduling and weather lookups.
# Leave empty to fall back to fixed HH:MM schedules and to disable weather gating.
location:
  lat:            # e.g. 50.08
  lon:            # e.g. 14.43
  tz:             # IANA name, e.g. "Europe/Prague"

# User-facing notifications. Values are ENV VAR NAMES, not the secrets themselves.
telegram:
  token_env: TELEGRAM_TOKEN
  chat_id_env: TELEGRAM_CHAT_ID

# Optional AI scene descriptions via Groq vision.
groq:
  api_key_env: GROQ_API_KEY

# Optional face labelling. names_env names an env var holding
# "face_id:name,face_id:name"; recognized-but-unlisted faces show as "unknown face".
faces:
  names_env: FACE_ID_NAMES

# Alert rate-limiting and the camera-down watchdog.
alerts:
  cooldown: 120            # min seconds between detection alerts per camera
  outage_threshold: 900    # seconds a camera must be unreachable before a 🔴 alert

# Loop cadence. Detections are polled fast (event_interval) on the already-connected
# client so the live snapshot is taken while the subject is still in frame; camera
# control + reconnect runs on the wider control_interval (frequent re-logins risk the
# C560WS source-IP lockout).
loop:
  event_interval: 4        # seconds between getEvents detection polls
  control_interval: 60     # seconds between tracking/sensitivity/preset + reconnect

cameras:
  - name: front              # unique label used in logs/alerts
    host: "<LAN_CAMERA_IP>"    # camera IP or DNS name on your LAN
    role: tracking           # tracking | static
    schedule: astral         # astral | always_night | always_day
    # person_sensitivity: 40   # optional 0-100; lower = fewer false AI-person detections

    # Camera login. Values below are ENV VAR NAMES, not the secrets themselves.
    user_env: CAM_USER             # env var holding the camera username
    password_env: CAM_PASSWORD     # env var holding the camera password
    # cloud_password_env: CAM_CLOUD_PASSWORD  # optional; defaults to the password

    # RTSP/ONVIF login for snapshot capture. Often a SEPARATE account from the
    # pytapo login above. Values are ENV VAR NAMES, not the secrets themselves.
    rtsp_user_env: CAM_RTSP_USER       # env var holding the RTSP username
    rtsp_password_env: CAM_RTSP_PASSWORD  # env var holding the RTSP password
    # rtsp_port: 554             # optional; RTSP port (default 554)
    # rtsp_stream: stream1       # optional; stream1 (HD) | stream2 (SD)
    # Optional local-recorder fallback is deployment-wide, not per camera: set
    # RECORDING_ROOT and RECORDING_MAX_AGE in the daemon environment only if you
    # continuously record RTSP under <root>/<camera-host>/<YYYY-MM-DD>/<HH>/.

    # SD-card follow-up for confirmed people: when the live grab misses the subject,
    # pull frames from the camera's SD recording (window sized from the event's own
    # start..end seconds) and send the one the subject is in. Needs an SD card in the
    # camera and the TP-Link account password (cloud_password_env) for the download.
    sd_snapshot: false
    # sd_span_cap: 120         # optional; max seconds of SD recording to scan per event.
    #                          # Default (48) fits a Pi Zero download budget; events run
    #                          # ~2 min, so hosts with faster I/O (Pi 4) may raise this
    #                          # to scan the whole event. Frame count stays ~8 regardless.
    # sd_motion: false       # optional; with sd_snapshot, give PIR-backed bare motion
    #                          # an SD second chance when the live frame is empty. Leave
    #                          # off on weak hosts; software-only motion still drops.
    # sd_jobs_per_tick: 1    # optional; slow-host backpressure. Process at most this
    #                          # many due SD follow-ups per daemon loop; unset drains all.
    # night_only: false      # optional; detect and alert only during the astral night
    #                          # window. Camera control/tracking still runs 24/7, but by
    #                          # day detection is muted (events drained silently so the
    #                          # backlog doesn't replay at nightfall) and ALL Telegram —
    #                          # including camera-down notices — is suppressed. For sites
    #                          # that only care about after-hours intruders.

    detection:
      sources: [getevents]   # subset of: onvif, getevents, motion
      strict_people: true    # only alert on confirmed people (ignore generic motion)

    tracking:
      smarttrack: [people]   # subset of: people, vehicle, pet, baby
      day_preset: "2"        # PTZ preset to park at during the day (static)
      night_preset:          # optional preset for night

    weather:
      strategy: lower_sensitivity   # none | disable_tracking | lower_sensitivity
      motion_normal: 60             # motion sensitivity (0-100) when dry
      motion_rain: 20               # lowered sensitivity while raining
      precip_threshold: 0.1         # mm; at/above this it counts as rain
      clear_delay: 1800             # keep rain mode this many seconds after rain stops
      poll_interval: 900            # how often (s) to query the weather API
      storm_park: false             # rain also parks the PTZ (stop swinging after
                                    # raindrops/branches); composes with any strategy

    enrich:
      snapshot: rtsp         # rtsp (live frame) | sd (recorded clip frame)
      groq: true             # send the frame to Groq for a short description

    sampler:
      enabled: false         # follow-up grabs across the whole event window
      interval: 30           # seconds between follow-up grabs
      max_frames: 6          # grabs per event group (interval*max_frames = window)
      group_gap: 90          # events closer than this merge into one group
      stream: stream1        # optional high-res stream for follow-up grabs

    scorer:
      url:                   # e.g. http://127.0.0.1:8765/score; empty = Groq arbiter
      threshold: 0.4         # min person/animal confidence to send a frame
      timeout: 10            # seconds per scoring request

    coordinator:
      group:                 # cameras sharing a group hand off detections to each other
      handoff_preset:        # preset this camera turns to when a group peer detects

  - name: yard
    host: "<SECOND_LAN_CAMERA_IP>"
    role: static
    schedule: astral
    detection:
      sources: [getevents, motion]
    weather:
      strategy: none
