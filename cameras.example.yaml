# tapo-monitor example configuration.
#
# Copy to `cameras.yaml` (git-ignored) and fill in your own values. NOTHING here is
# real — no coordinates, hosts or secrets ship in the repository. Secrets are read
# from environment variables referenced by name (so the file itself stays safe to share).

# Shared location for astral (sunset/sunrise) scheduling and weather lookups.
# Leave empty to fall back to fixed HH:MM schedules and to disable weather gating.
location:
  lat:            # private deployment latitude
  lon:            # private deployment longitude
  tz:             # IANA timezone name

# User-facing notifications. Values are ENV VAR NAMES, not the secrets themselves.
telegram:
  token_env: TELEGRAM_TOKEN
  chat_id_env: TELEGRAM_CHAT_ID

# Optional AI scene descriptions via Groq vision.
groq:
  api_key_env: GROQ_API_KEY

# Optional face labelling. names_env names an env var holding
# "face_id:name,face_id:name"; recognized-but-unlisted faces show as "unknown face".
faces:
  names_env: FACE_ID_NAMES

# Alert rate-limiting and the camera-down / daemon-stall watchdogs.
alerts:
  cooldown: 120            # min seconds between detection alerts per camera
  outage_threshold: 900    # seconds a camera must be unreachable before a 🔴 alert
  stall_threshold: 900     # seconds of failing daemon ticks before a 🔴 alert

# Loop cadence. Detections are polled fast (event_interval) on the already-connected
# client so the live snapshot is taken while the subject is still in frame; camera
# control + reconnect runs on the wider control_interval (frequent re-logins risk the
# C560WS source-IP lockout).
loop:
  event_interval: 4        # seconds between getEvents detection polls
  control_interval: 60     # seconds between tracking/sensitivity/preset + reconnect

# Camera Digital Twin + Shadow Detection Auditor. Both are opt-in while their data and
# alert policy are calibrated. Probes reuse the daemon's existing authenticated session;
# they never create an extra login loop. The ledger stores normalized metadata only — no
# frames, credentials, device IDs or face IDs.
observability:
  digital_twin: false      # read safe camera capabilities/state and detect config drift
  probe_interval: 900      # seconds; deliberately low-frequency and lockout-aware
  drift_alerts: false      # Telegram only new/recovered drift transitions when enabled
  ledger: false            # local SQLite event/decision ledger (TAPO_LEDGER_FILE overrides)
  ledger_retention_days: 30
  shadow_match_window: 20  # seconds for camera ↔ independent shadow observation matching

cameras:
  - name: front              # unique label used in logs/alerts
    host: "<LAN_CAMERA_IP>"    # camera IP or DNS name on your LAN
    role: tracking           # tracking | static
    schedule: astral         # astral | always_night | always_day
    # person_sensitivity: 40   # optional 0-100; lower = fewer false AI-person detections
    # night_vision: ir         # optional; force IR/B&W night vision on the astral night
    #                          # schedule (day/colour by day), re-asserted each control tick.
    #                          # A colour night mode under a streetlight uses a slow shutter
    #                          # that smears moving subjects; IR runs a faster shutter, so the
    #                          # event frame is sharper. "auto" re-asserts the camera's own
    #                          # day/night switch instead. Unset leaves the camera untouched.

    # Camera login. Values below are ENV VAR NAMES, not the secrets themselves.
    user_env: CAM_USER             # env var holding the camera username
    password_env: CAM_PASSWORD     # env var holding the camera password
    # cloud_password_env: CAM_CLOUD_PASSWORD  # optional; defaults to the password

    # RTSP/ONVIF login for snapshot capture. Often a SEPARATE account from the
    # pytapo login above. Values are ENV VAR NAMES, not the secrets themselves.
    rtsp_user_env: CAM_RTSP_USER       # env var holding the RTSP username
    rtsp_password_env: CAM_RTSP_PASSWORD  # env var holding the RTSP password
    # rtsp_port: 554             # optional; RTSP port (default 554)
    # rtsp_stream: stream1       # optional; stream1 (HD) | stream2 (SD)
    # Optional local-recorder tree is deployment-wide, not per camera: set RECORDING_ROOT
    # (e.g. /srv/recordings) and RECORDING_MAX_AGE in the daemon environment only if you
    # continuously record RTSP under <root>/<camera-host>/<YYYY-MM-DD>/<HH>/. It powers
    # both the last-resort live-fallback frame AND snapshot_source: recording below.

    # SD-card follow-up for confirmed people: when the live grab misses the subject,
    # pull frames from the camera's SD recording (window sized from the event's own
    # start..end seconds) and send the one the subject is in. Needs an SD card in the
    # camera and the TP-Link account password (cloud_password_env) for the download.
    sd_snapshot: false
    # snapshot_source: sd      # optional; where the follow-up's candidate frames come from.
    #                          # "sd" (default) downloads the event segment from the camera
    #                          # SD card. "recording" instead extracts them from a local
    #                          # 24/7 recorder mkv (RECORDING_ROOT above): full stream1 res
    #                          # even when live detection runs on stream2, and it picks the
    #                          # SHARPEST above-threshold frame (ffmpeg blurdetect) rather
    #                          # than the first — night motion smears single frames. Requires
    #                          # sd_snapshot: true (it reuses the SD follow-up queue); falls
    #                          # back to the SD/live path when no segment or RECORDING_ROOT.
    # sd_span_cap: 120         # optional; max seconds of SD recording to scan per event.
    # sd_motion_span_cap: 48   # optional; initial window for unconfirmed motion/PIR.
    #                          # If empty, one retry expands to sd_span_cap.
    #                          # Default (48) fits a Pi Zero download budget; events run
    #                          # ~2 min, so hosts with faster I/O (Pi 4) may raise this
    #                          # to scan the whole event. Frame count stays ~8 regardless.
    # sd_motion: false       # optional; with sd_snapshot, give PIR-backed bare motion
    #                          # an SD second chance when the live frame is empty. Leave
    #                          # off on weak hosts; software-only motion still drops.
    # sd_jobs_per_tick: 1    # optional; slow-host backpressure. Process at most this
    #                          # many due SD follow-ups per daemon loop; unset drains all.
    # night_only: false      # optional; detect and alert only during the astral night
    #                          # window. Camera control/tracking still runs 24/7, but by
    #                          # day detection is muted (events drained silently so the
    #                          # backlog doesn't replay at nightfall) and ALL Telegram —
    #                          # including camera-down notices — is suppressed. For sites
    #                          # that only care about after-hours intruders.

    detection:
      sources: [getevents]   # subset of: onvif, getevents, motion
      strict_people: true    # only alert on confirmed people (ignore generic motion)

    tracking:
      smarttrack: [people]   # subset of: people, vehicle, pet, baby
      day_preset: "2"        # PTZ preset to park at during the day (static)
      night_preset:          # optional preset for night

    # Soft pan-limit (optional). The C560WS auto-track physically follows a target
    # anywhere — the local Tapo API exposes no angular limit and no motor position — so it
    # can swing past your last useful preset (into a wall/neighbour) and sit there until it
    # times out. ONVIF *does* expose position, so the daemon reads the current pan and,
    # when it drifts outside the span of the camera's presets (leftmost..rightmost), recalls
    # the camera to that bounding preset. Needs ONVIF enabled on the camera; the presets
    # themselves define the allowed range (no angles to enter).
    # pan_limit:
    #   enabled: true
    #   margin: 0.01           # slack (ONVIF pan units) so tracking near a bound is stable
    #   poll_interval: 6       # seconds between ONVIF position checks
    #   onvif_port: 2020
    #   onvif_user_env: CAM_ONVIF_USER       # env var NAMES, not the secrets
    #   onvif_password_env: CAM_ONVIF_PASSWORD

    weather:
      strategy: lower_sensitivity   # none | disable_tracking | lower_sensitivity
      motion_normal: 60             # motion sensitivity (0-100) when dry
      motion_rain: 20               # lowered sensitivity while raining
      precip_threshold: 0.1         # mm; at/above this it counts as rain
      clear_delay: 1800             # keep rain mode this many seconds after rain stops
      poll_interval: 900            # how often (s) to query the weather API
      storm_park: false             # rain also parks the PTZ (stop swinging after
                                    # raindrops/branches); composes with any strategy

    enrich:
      snapshot: rtsp         # rtsp (live frame) | sd (recorded clip frame)
      groq: true             # send the frame to Groq for a short description

    sampler:
      enabled: false         # follow-up grabs across the whole event window
      interval: 30           # seconds between follow-up grabs
      max_frames: 6          # grabs per event group (interval*max_frames = window)
      group_gap: 90          # events closer than this merge into one group
      stream: stream1        # optional high-res stream for follow-up grabs
      low_score_exit: 0      # close a motion-only group after N consecutive frames
                             # below low_score (0 = off); person/PIR-confirmed
                             # groups always run the full window
      low_score: 0.15        # "nothing there" score for the early-exit streak

    scorer:
      url:                   # e.g. http://127.0.0.1:8765/score; empty = Groq arbiter
      threshold: 0.4         # min person/animal confidence to send a frame
      timeout: 10            # seconds per scoring request
      tiles: 1               # 1 = whole frame only; 2+ also scores a tile grid so a
                             # distant subject is not lost when the wide view is resized
    # crop_to_subject: true   # optional padded zoom around the scorer's best person box,
                             # widened just enough that a standing figure is not a sliver;
                             # keeps the full frame if no usable box is available
    # crop_min_frac: 0.12     # smallest crop as a fraction of the frame (default 0.22).
                             # The floor stops a distant subject arriving as a postage
                             # stamp, but it also caps the zoom — where people are small
                             # and far, lower it. See
                             # docs/configuration.md#how-small-the-zoom-may-get
    # crop_from_native: true  # crop before the downscale, so the zoom keeps the camera's
                             # detail. Costs a native grab: free on a Pi 4, about +0.5s
                             # on a Pi Zero 2 W. A stream already at delivery width skips
                             # it automatically — see
                             # docs/configuration.md#cropping-at-native-resolution

    # Reserved for the planned multi-camera handoff coordinator; parsed but not yet
    # executed by the daemon. Leave empty in production configs.
    # coordinator:
    #   group:
    #   handoff_preset:

  - name: yard
    host: "<SECOND_LAN_CAMERA_IP>"
    role: static
    schedule: astral
    detection:
      # getevents is the production-wired source. onvif/motion are accepted for research
      # compatibility but do not currently run as independent daemon sources.
      sources: [getevents]
    weather:
      strategy: none

  # ── battery camera bound to a hub (opt-in; keep commented until go2rtc runs) ──
  # A battery camera keeps no event index of its own — its clips live on the hub and it
  # sleeps between events — so detections are polled from the hub and the alert frame
  # comes from a go2rtc sidecar. See docs/configuration.md#battery-cameras-on-a-hub-hubpoll
  # - name: gate
  #   host: "<BATTERY_CAMERA_IP>"       # informational here: no RTSP, no stok login
  #   role: static
  #   detection:
  #     sources: [hubpoll]
  #   hub_host: "<HUB_IP>"
  #   hub_user_env: HUB_EMAIL           # Tapo account e-mail, by env var name
  #   hub_password_env: HUB_PASSWORD    # Tapo account password
  #   go2rtc_src: gate                  # stream name in go2rtc.yaml
  #   hub_poll_interval: 20
  #   # hub_device_mac:                 # pin only when one hub holds several cameras and
  #   # hub_device_id:                  # neither the alias nor the MAC can be matched
