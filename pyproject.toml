[build-system]
# 77+ for the PEP 639 license expression and license-files below.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tapo-monitor"
version = "0.8.0"
description = "Lightweight reliability, camera-control and Telegram alerting stack for TP-Link Tapo PTZ cameras."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "PeterkoCZ91" }]
keywords = ["tapo", "tp-link", "ptz", "camera", "telegram", "home-assistant", "mqtt", "monitoring"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: No Input/Output (Daemon)",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Home Automation",
    "Topic :: Multimedia :: Video :: Capture",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "pytapo",
    # pytapo's media_stream Downloader (SD-card clip download) imports aiofiles at
    # runtime but does not declare it — without it, sd_snapshot fails on a clean install.
    "aiofiles",
    "astral",
    "PyYAML",
]

[project.urls]
Homepage = "https://github.com/PeterkoCZ91/tapo-monitoring"
Documentation = "https://github.com/PeterkoCZ91/tapo-monitoring/blob/main/docs/README.md"
Changelog = "https://github.com/PeterkoCZ91/tapo-monitoring/blob/main/CHANGELOG.md"
Issues = "https://github.com/PeterkoCZ91/tapo-monitoring/issues"
Source = "https://github.com/PeterkoCZ91/tapo-monitoring"

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "mypy", "ruff"]
scorer = ["onnxruntime", "numpy", "Pillow"]
# pan_limit reads PTZ position over ONVIF; the import is lazy (guard's first poll), so
# selfcheck passes without it while the guard sits inert. Install where pan_limit is on.
onvif = ["onvif-zeep"]
# Opt-in MQTT bridge with Home Assistant discovery (mqtt: block). Imported only when the
# block is set; without the library the daemon logs the install hint and runs without it.
mqtt = ["paho-mqtt>=1.6"]

[project.scripts]
tapo-monitor = "tapo_monitor.cli:main"

# Only the package goes into the wheel. It reads no data files at runtime (the labelling
# page is inline HTML); tests/, docs/, tools/ and systemd/ belong to a checkout.
[tool.setuptools]
packages = ["tapo_monitor"]
py-modules = []
include-package-data = false

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Tests set env vars / sys.path and use local imports before module import on purpose.
"tests/**" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Type checking is deliberately at its first rung: the package carries almost no
# annotations, so the goal here is the errors that survive without them — a name that
# cannot hold what is assigned to it, a call that cannot match its signature. That is
# the class of fault that has actually reached production (a package copied without one
# module produced AttributeError for hours), and it is invisible to tests that never
# take the branch.
[tool.mypy]
files = ["tapo_monitor"]
# Deliberately not pinned to the package's own floor (3.10): numpy ships stubs written
# with 3.12 `type` statements, and analysing them under 3.10 semantics is a syntax error
# that stops the run before a single module of ours is checked. mypy therefore follows
# the interpreter it runs on, which in CI is the same 3.12 leg as ruff and shellcheck.
# Third-party packages here ship no stubs (pytapo, astral, onnxruntime); without this,
# every import would drown the real findings.
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
# The next rung, when someone has an afternoon: check_untyped_defs = true. It finds ~30
# more, mostly missing annotations on empty collections, plus false positives on
# SubjectScore(float) and Frame(str), which assign attributes in __new__ where mypy
# cannot see them. Annotate those two classes first, or the noise buries the signal.

# Coverage is read as a map of what the tests never enter, not as a score to raise.
# The floor only stops it from silently sliding: it sits just under today's number, so
# deleting tests fails while ordinary work does not.
[tool.coverage.run]
source = ["tapo_monitor"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
# Today's number is 88 % with every test running. The floor sits below it so ordinary
# work has room, but deleting a module's tests — which is how the scorer's 34 silently
# stopped running once already — cannot pass unnoticed.
fail_under = 86
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    # Entry points that need a real camera, a model file or a terminal.
    "if __name__ == .__main__.:",
]
