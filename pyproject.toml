[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tapo-monitor"
version = "0.1.0"
description = "Comprehensive, config-driven monitoring stack for TP-Link Tapo PTZ cameras (detection, auto-tracking, AI descriptions, Telegram alerts)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pytapo",
    "astral",
    "PyYAML",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
tapo-monitor = "tapo_monitor.cli:main"

[tool.setuptools]
packages = ["tapo_monitor"]
py-modules = []

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
