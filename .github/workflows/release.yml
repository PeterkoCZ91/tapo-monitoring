name: Release

# Publishing a GitHub release uploads that tag's sdist and wheel to PyPI. There is no
# token anywhere: PyPI trusts this workflow through OpenID Connect (Trusted Publishing),
# configured once on pypi.org as described in docs/releasing.md.
on:
  release:
    types: [published]
  # Builds and checks the distributions without publishing, to try the job on a branch.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      # A tag that does not match the package version would publish the wrong number,
      # and PyPI never lets a version be uploaded twice.
      - name: Check the tag matches the package version
        if: github.event_name == 'release'
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "$version" ]; then
            echo "release tag $GITHUB_REF_NAME does not match pyproject version $version" >&2
            exit 1
          fi

      - name: Check the metadata renders on PyPI
        run: twine check --strict dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/tapo-monitor/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
