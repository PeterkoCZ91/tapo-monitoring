name: CI

on:
  push:
    branches: [main]
  pull_request:
  # A push event dropped during an Actions outage leaves that commit unverified with
  # nothing to re-run, since a run is only ever created in response to an event.
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Test (pytest)
        run: pytest -q
