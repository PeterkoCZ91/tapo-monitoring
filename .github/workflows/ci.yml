name: CI

on:
  push:
    branches: [main]
  pull_request:
  # A push event dropped during an Actions outage leaves that commit unverified with
  # nothing to re-run, since a run is only ever created in response to an event.
  workflow_dispatch:
  # Called by release.yml and docker.yml so nothing is published for a commit whose
  # suite is not green. No inputs or secrets; the caller's ref is what gets tested.
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    # The fleet does not run one Python. The host with the recorder is on 3.12 and both
    # Pis are on 3.13, so testing a single version means a 3.13-incompatible change ships
    # green and breaks two of the three sites, with the deploy already done. Lint and
    # shellcheck are version-independent, so they run once on the primary version.
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "${{ matrix.python-version }}"

      # The scorer extra is not optional for CI. tests/test_scorer_service.py opens with
      # pytest.importorskip("numpy"), and numpy lives in the scorer extra, so installing
      # only [dev] skipped that whole module: 34 tests covering the one component whose
      # death stops alerts at every site at once had never run here. Verified against the
      # run for cf8998d, which reported 893 passed instead of 927.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,scorer]"

      # Guard the guard. importorskip turns a missing dependency into a green build with
      # a whole module quietly absent, which is exactly how those 34 went unnoticed. Naming
      # the module keeps this assertion true as tests are added, unlike a total count.
      - name: Assert the scorer service tests are collected, not skipped
        run: pytest tests/test_scorer_service.py --collect-only -q | grep -q "::"

      - name: Lint (ruff)
        if: matrix.python-version == '3.12'
        run: ruff check .

      # Types, at the rung an unannotated package can actually hold: a name that cannot
      # keep what is assigned to it, a call that cannot match its signature. Tests only
      # cover the branches they take; this reads the ones they never enter.
      - name: Types (mypy)
        if: matrix.python-version == '3.12'
        run: mypy

      - name: Lint (shellcheck)
        if: matrix.python-version == '3.12'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck tools/*.sh pi_notify.sh tests/tools/helper.bash

      # The shell layer deploys the fleet, and shellcheck only says the syntax is sound.
      # These tests run the deploy, rollback and check scripts for real against stubbed
      # ssh/systemd/curl, so a wrong path or a swallowed argument fails here instead of
      # on a host. Version-independent like the linters, so once is enough.
      - name: Test (bats)
        if: matrix.python-version == '3.12'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bats
          bats tests/tools

      # --cov on both legs on purpose: the floor is about the suite as a whole, and the
      # two versions do not run identical branches (3.13 takes different stdlib paths).
      # Coverage here is a regression brake, not a target — see [tool.coverage] in
      # pyproject.toml for what the number is and is not for.
      - name: Test (pytest)
        run: pytest -q --cov

  # A parallel job, so it never lengthens the test job above. Two simulated days of the real
  # daemon (through daemon.tick: stall watchdog and status view included) against fake
  # cameras on a fake clock, for three fixed seeds: catches memory, thread, state-file and
  # leftover-file growth and tick exceptions that a unit test cannot see. About a minute
  # per seed; the step fails on the first seed that exceeds a limit and names it.
  soak:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Accelerated soak (3 seeds x 2 simulated days)
        timeout-minutes: 10
        run: |
          for seed in 1 2 3; do
            echo "::group::soak seed ${seed}"
            python tools/soak_sim.py --days 2 --seed "${seed}" --features all --wrapper || {
              echo "::error::soak_sim failed for seed ${seed}"; exit 1; }
            echo "::endgroup::"
          done
